services:
  wizarr:
    container_name: wizarr
    image: ghcr.io/wizarrrr/wizarr
    restart: unless-stopped
    networks:
      - apps
    ports:
      - 5690:5690
    volumes:
      - $APPDIR/wizarr:/data
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - DISABLE_BUILTIN_AUTH=false
