services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    networks:
      - default
      - apps
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "1000:80/tcp"
      - "1001:443/tcp"
    environment:
      TZ: $TZ
      FTLCONF_webserver_api_password: $PIHOLE_PASSWORD
      FTLCONF_dns_listeningMode: 'all'
    volumes:
      - '$APPDIR/pihole/etc-pihole:/etc/pihole'
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - "homepage.services.pihole.name=Pi-hole"
      - "homepage.services.pihole.icon=pi-hole"
      - "homepage.services.pihole.url=http://localhost:1000/admin"
      - "homepage.services.pihole.status_url=http://localhost:1000/admin/api.php?status"