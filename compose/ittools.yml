services:
  ittools:
    container_name: ittools
    image: ghcr.io/sharevb/it-tools:latest
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    #pull_policy: always
    restart: unless-stopped
    networks:
      - apps
    ports:
      - 3041:8080
    volumes:
      - $APPDIR/ittools/config/tools-filter.json:/usr/share/nginx/html/tools-filter.json:ro
